name: BackLash monitor

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Отправить тестовое сообщение в Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: backlash-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Проверить каталог и отправить уведомления
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
        run: |
          save_state() {
            if [[ -z "$(git status --porcelain -- state.json)" ]]; then
              return 0
            fi
            git add -- state.json
            git commit -m "state update"
            git push origin HEAD:main
          }

          if [[ "$TEST_TELEGRAM" == "true" ]]; then
            python3 -B check.py test-telegram
            exit
          fi

          git config user.name "backlash-bot"
          git config user.email "actions@github.com"

          scan_status=0
          timeout 7m python3 -B check.py scan || scan_status=$?
          save_state

          delivery_status=0
          python3 -B check.py deliver || delivery_status=$?
          save_state

          if (( scan_status != 0 || delivery_status != 0 )); then
            exit 1
          fi
