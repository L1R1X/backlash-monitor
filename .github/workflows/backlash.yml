name: BackLash monitor
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push: {branches: [main]}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: {group: backlash-monitor, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Proverit BackLash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -B check.py
      - name: Sohranit bazu
        run: |
          cp state.json /tmp/state.new 2>/dev/null || exit 0
          for i in 1 2 3 4 5; do
            git fetch origin main 2>/dev/null
            git reset --hard origin/main 2>/dev/null
            cp /tmp/state.new state.json
            git diff --quiet -- state.json && exit 0
            git config user.name "backlash-bot"
            git config user.email "backlash-bot@github"
            git add state.json
            git commit -m "state update" 2>/dev/null
            git push && exit 0
            sleep $((RANDOM % 5 + 3))
          done
          exit 1
